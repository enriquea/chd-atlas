# Every external resource the atlas mirrors, with the release it was taken from
# and the licence that governs republishing it. Verified against each authority
# on the `retrieved_on` date recorded below.
sources:
  - id: audain2026_sd3
    name: >-
      Audain et al. 2026, npj Genomic Medicine 11, Supplementary Data 3
      (per-gene rare variant burden, aCHD / sCHD / nsCHD versus controls)
    # A journal supplement carries no release tag, so the file's own sha256 is
    # the version -- and unlike a `retrieved_on` date it is checkable: a curator
    # can prove they hold the identical workbook these 1,192 rows came from.
    # The file itself is NOT committed (`local/` is gitignored): it is 11 MB,
    # its redistribution terms are the article's, and the reviewable artifact is
    # `mirrors/burden.tsv`. Reproduce with `scripts/convert_burden.py`.
    version: "sha256:8ebb6fdceb38b0099d6229a1ebf4d77db9f9492a62cfafb569d2865f9645ee2b"
    retrieved_on: 2026-08-04
    url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41525-026-00582-z/MediaObjects/41525_2026_582_MOESM4_ESM.xlsx
    # "This article is licensed under a Creative Commons Attribution 4.0
    # International License ... To view a copy of this licence, visit
    # http://creativecommons.org/licenses/by/4.0/" -- the article's own licence
    # statement, which covers its supplementary material.
    licence: CC-BY-4.0
    redistribution: permitted_with_attribution
  - id: audain2021_s6
    name: >-
      Audain et al. 2021, PLoS Genetics 17(7) e1009679, S6 Table Sheet A
      (gene-based case/control CNV-deletion permutation testing, PLINK)
    version: "sha256:e8bd50c0a454d3f5563a6c1ee52c62206d98840cc696c3c8db4c0e0eccb63e62"
    retrieved_on: 2026-08-05
    url: https://journals.plos.org/plosgenetics/article/file?id=10.1371/journal.pgen.1009679.s011&type=supplementary
    # "This is an open access article, free of all copyright, and may be freely
    # reproduced, distributed, transmitted, modified, built upon, or otherwise
    # used by anyone for any lawful purpose. The work is made available under
    # the Creative Commons CC0 public domain dedication." -- the article's own
    # licence statement, which covers its supplementary material. CC0, not the
    # CC BY that PLOS uses for some titles: read off this article, not assumed.
    licence: CC0-1.0
    redistribution: permitted
  - id: clingen
    name: Clinical Genome Resource (ClinGen) Gene-Disease Validity
    # The bulk CSV carries no version tag. Its banner stamps the date the file
    # was generated, which is the only version identifier the authority offers.
    version: "FILE CREATED: 2026-08-03"
    retrieved_on: 2026-08-03
    url: https://search.clinicalgenome.org/kb/gene-validity
    # "All curated content published by ClinGen is available free of restriction
    # under the CC0 1.0 Universal (CC0 1.0) Public Domain Dedication."
    # -- https://clinicalgenome.org/docs/terms-of-use/
    licence: CC0-1.0
    redistribution: permitted
  - id: gencc
    name: Gene Curation Coalition (GenCC) submissions export
    # The export carries no release/version tag of its own -- `sgc_id` and
    # `version_number` identify one submission, not one release of the file.
    # `retrieved_on` is the only version identifier this authority offers, the
    # same situation as `clingen` above.
    version: "retrieved 2026-08-03"
    retrieved_on: 2026-08-03
    url: https://search.thegencc.org/download
    # "The GenCC data are available free of restriction under a CC0 1.0
    # Universal (CC0 1.0) Public Domain Dedication." GenCC additionally
    # "requests that you give attribution to GenCC and the contributing
    # sources whenever possible and appropriate" -- a request, not a licence
    # condition: CC0 waives all rights, so nothing here is legally required.
    # Same classification as the `clingen` and `hgnc` entries below, both
    # also CC0. -- https://thegencc.org/terms
    licence: CC0-1.0
    redistribution: permitted
  - id: hgnc
    name: HUGO Gene Nomenclature Committee
    # `mirrors/genes.tsv` is now derived from the complete-set TSV rather than
    # the REST service, and that file carries no release tag inside it. Both
    # metadata the authority does publish agree on the same day and are
    # recorded as the version: the download's own `last-modified` header reads
    # Fri, 31 Jul 2026 12:53:50 GMT, and `https://rest.genenames.org/info`
    # reports lastModified 2026-07-31T11:49:58.141Z.
    version: "2026-07-31"
    retrieved_on: 2026-08-04
    url: https://www.genenames.org/
    # "all data is released under the Creative Commons Public Domain (CC0)
    # License ... any form of reuse of the content is permitted"
    # — https://www.genenames.org/about/license/
    licence: CC0-1.0
    redistribution: permitted
  - id: hpo
    name: Human Phenotype Ontology
    # `data-version` recorded in the header of the pinned release below.
    version: "hp/releases/2026-06-23"
    retrieved_on: 2026-07-31
    url: https://hpo.jax.org/
    # HPO uses a custom licence with no SPDX identifier. The pinned release
    # declares `property_value: terms:license https://hpo.jax.org/app/license`,
    # and both the OBO Foundry and Bioregistry registries record the same URL.
    licence: https://hpo.jax.org/app/license
    redistribution: permitted_with_attribution
    ontology_prefix: HP
    ontology_file: ontologies/hp-2026-06-23.obo
