# Every record here is transcribed from the PubMed entry for its PMID, except
# `study_type`: PubMed has no study-design field, so that value is read off the
# paper itself and the reading is recorded alongside it.
# `title` is NCBI's ArticleTitle verbatim: the "[corrected]" marker is PubMed's
# own annotation of the erratum at Nat Genet 1997 Apr;15(4):411, and `journal`
# is NLM's full journal title (ISO abbreviation "Nat Genet").
publications:
  - id: PMID:8988165
    title: >-
      Mutations in human TBX5 [corrected] cause limb and cardiac malformation
      in Holt-Oram syndrome.
    journal: Nature genetics
    year: 1997
    authors:
      - Basson CT
      - Bachinsky DR
      - Lin RC
      - Levi T
      - Elkins JA
      - Soults J
      - Grayzel D
      - Kroumpouzou E
      - Traill TA
      - Leblanc-Straceski J
      - Renault B
      - Kucherlapati R
      - Seidman JG
      - Seidman CE
    # From the abstract: TBX5 mutations were found in affected members of
    # separate Holt-Oram families. That is family-based linkage and mutation
    # screening, not a comparison of unrelated cases against controls.
    study_type: family_linkage
    doi: 10.1038/ng0197-30
    own_lab: false
  - id: PMID:42230622
    title: >-
      Assessing the contribution of rare variants to congenital heart disease
      through a large-scale case-control exome study.
    journal: NPJ genomic medicine
    year: 2026
