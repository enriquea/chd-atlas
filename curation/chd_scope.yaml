# What counts as congenital heart disease for this atlas.
#
# RULE (decided 2026-08-03): a term is in scope if it names a congenital structural
# malformation of the heart, or names a syndrome whose definition includes one.
# Cardiomyopathy, arrhythmia, channelopathy, aortopathy and acquired cardiac disease
# are out, however many genes they carry.
#
# A gene enters the atlas only if some mirrored row names a term on this list.
# Neither mechanical rule works: filtering by expert panel drops TBX5, NOTCH1 and CHD7,
# and no MONDO is_a closure means CHD (see src/chd_atlas/models/scope.py). Labels are
# transcribed from the mirrors and checked by SCP002.
diseases:
  - id: MONDO:0000119
    label: congenital heart defects, multiple types
    reason: >-
      Multiple congenital structural cardiac malformations.
    admitted_by: Enrique Audain
    admitted_on: 2026-08-03
