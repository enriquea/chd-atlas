[project]
name = "chd-atlas"
version = "0.1.0"
description = "Curated evidence linking genes, variants and proteins to congenital heart disease"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "ruamel.yaml>=0.18",
    "polars>=1.0",
    "pronto>=2.5",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
chd-atlas = "chd_atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chd_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/chd_atlas"]
