[project]
name = "chd-atlas"
version = "0.1.0"
description = "Curated evidence linking genes, variants and proteins to congenital heart disease"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "ruamel.yaml>=0.18",
    "polars>=1.0",
    "pronto>=2.5",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
chd-atlas = "chd_atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chd_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# B008 guards against a mutable default being built once at definition time and
# then shared across calls. `typer.Option` is the opposite: the OptionInfo it
# returns is metadata that typer strips off and replaces with the parsed value
# before the command body ever runs, so no state is shared between invocations.
# Ruff provides this setting for exactly this pattern.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/chd_atlas"]

# pronto ships py.typed, but builds its `__all__` from runtime expressions
# (`Ontology.__name__`) rather than string literals. mypy cannot evaluate those
# statically, so under `strict` (which implies `--no-implicit-reexport`) it
# treats `pronto.Ontology` as unexported. This re-enables re-export for pronto
# only; its types are still fully checked, and it keeps `validate/ontology.py`
# on pronto's documented public API rather than the submodules its own
# docstring declares unstable.
[[tool.mypy.overrides]]
module = ["pronto.*"]
implicit_reexport = true
